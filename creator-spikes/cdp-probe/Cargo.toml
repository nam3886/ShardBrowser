[package]
name = "cdp-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

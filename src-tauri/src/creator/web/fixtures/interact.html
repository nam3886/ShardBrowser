<!doctype html>
<html><head><meta charset="utf-8"><title>Interact</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #a { position: absolute; left: 80px; top: 120px; padding: 10px 18px; }
  #name { position: absolute; left: 420px; top: 300px; width: 200px; }
  #b { position: absolute; left: 760px; top: 480px; padding: 10px 18px; }
</style></head>
<body>
  <button id="a">First</button>
  <input id="name">
  <button id="b">Second</button>
  <pre id="out" hidden>{}</pre>
<script>
  // Interaction realism: what input looks like to page script. The summary is
  // JSON in #out (read by the stealth bench from the isolated world).
  const ev = [];          // ordered: type, target, trusted
  const pts = [];         // pointermove points with timestamps
  const keyT = [];        // keydown times
  const untrusted = new Set();
  const tag = (t) => (t && t.id) || (t === window ? "window" : t && t.nodeName) || "?";
  const keep = ["pointerover", "pointerenter", "mouseover", "pointerdown", "mousedown", "pointerup", "mouseup",
    "click", "focus", "blur", "focusin", "focusout", "keydown", "keyup", "beforeinput", "input", "change"];
  for (const type of keep) {
    addEventListener(type, (e) => {
      if (!e.isTrusted) untrusted.add(type);
      if (type === "keydown") keyT.push(e.timeStamp);
      ev.push(type + "@" + tag(e.target));
      write();
    }, true);
  }
  addEventListener("pointermove", (e) => {
    if (!e.isTrusted) untrusted.add("pointermove");
    pts.push([e.clientX, e.clientY, e.timeStamp, e.pointerType]);
    write();
  }, true);
  function write() {
    const steps = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
    const gaps = keyT.slice(1).map((t, i) => Math.round(t - keyT[i]));
    // Points off the straight line between first and last move: a robot path is a line or a jump.
    let maxOff = 0;
    if (pts.length > 2) {
      const [x0, y0] = pts[0], [x1, y1] = pts[pts.length - 1];
      const len = Math.hypot(x1 - x0, y1 - y0) || 1;
      for (const [x, y] of pts) maxOff = Math.max(maxOff, Math.abs((y1 - y0) * x - (x1 - x0) * y + x1 * y0 - y1 * x0) / len);
    }
    document.getElementById("out").textContent = JSON.stringify({
      allTrusted: untrusted.size === 0,
      untrusted: [...untrusted],
      pointerMoves: pts.length,
      pointerTypes: [...new Set(pts.map((p) => p[3]))],
      maxStepPx: Math.round(Math.max(0, ...steps)),
      maxOffLinePx: Math.round(maxOff),
      keyGapsMs: gaps,
      value: document.getElementById("name").value,
      order: ev.filter((s) => !/^(pointerover|pointerenter|mouseover)@/.test(s)),
    });
  }
</script>
</body></html>
